# The Python agent demo, as a Compose stack.
#
# One service does the work: `demo` holds Trustvian v0.10.0 (the release
# archive, and the collector from its signed image, pinned in Dockerfile), the
# demo and everything `make bootstrap` sets up, and runs the repository's own
# entry points unchanged. The five *.localhost names the demo addresses its mock
# services and Ollama by are supplied here (extra_hosts) instead of by the
# operating system's resolver, which is the one thing a container lacks.
#
# Run from this directory:
#
#   docker compose build demo                                     # named: it is behind a profile
#   docker compose run --rm demo smoke                            # no model
#   docker compose run --rm --service-ports demo scenario         # Ollama on the host
#   docker compose run --rm --service-ports demo web              # browse the last result
#
# Live mode, three agents that keep working until stopped:
#
#   docker compose --profile live up -d --build                   # WebUI on http://127.0.0.1:8080/
#   docker compose --profile live down                            # stops it; the baseline is kept
#
# Ollama: the default is the one on your host, reached as ollama.localhost ->
# host-gateway. On Linux it must listen on all interfaces
# (OLLAMA_HOST=0.0.0.0). For an Ollama inside Compose:
#
#   OLLAMA_LOCALHOST=172.28.0.10 docker compose --profile ollama up -d ollama
#   docker compose exec ollama ollama pull gemma3:4b
#   OLLAMA_LOCALHOST=172.28.0.10 docker compose run --rm demo scenario
#
# (a fixed address, because ollama.localhost has to be an /etc/hosts entry —
# the demo probes that exact hostname and port.)

name: trustvian-python-agent-demo

services:
  demo:
    build:
      context: ..
      dockerfile: compose/Dockerfile
      # bootstrap.sh checks that these resolve before building anything, and
      # it runs at build time here.
      extra_hosts:
        - "crm.localhost:127.0.0.1"
        - "knowledge.localhost:127.0.0.1"
        - "mail.localhost:127.0.0.1"
        - "export.localhost:127.0.0.1"
        - "ollama.localhost:127.0.0.1"
    # One-shot; never started by a bare `docker compose up`.
    profiles: ["demo"]
    extra_hosts:
      # The mock services run inside this container, on a port the scripts
      # pick; the four names must point at its own loopback.
      - "crm.localhost:127.0.0.1"
      - "knowledge.localhost:127.0.0.1"
      - "mail.localhost:127.0.0.1"
      - "export.localhost:127.0.0.1"
      # Ollama is outside: the host by default, or the `ollama` service.
      - "ollama.localhost:${OLLAMA_LOCALHOST:-host-gateway}"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      # 1 keeps the control plane up after `scenario` so the WebUI can be
      # opened; needs `run --service-ports`.
      TRUSTVIAN_WEB: ${TRUSTVIAN_WEB:-0}
      # yes streams the agent's transcript to the terminal as it happens.
      AGENT_STREAM: ${AGENT_STREAM:-yes}
      TEMPERATURE: ${TEMPERATURE:-0.7}
    volumes:
      - ./out:/out
    ports:
      # Only published with `docker compose run --service-ports`.
      - "127.0.0.1:${TRUSTVIAN_WEB_PORT:-8080}:8080"
    networks:
      - demo
    restart: "no"

  live:
    # The demo image, long-running: scripts/live.sh attached to a control
    # plane of its own, published on 127.0.0.1:8080. Started only with
    # `--profile live`; the one-shot demo service is unchanged.
    extends:
      service: demo
    profiles: !override ["live"]
    command: ["live"]
    environment:
      # Live mode's model (scripts/live.sh says why it is not gemma3:4b).
      OLLAMA_MODEL: ${LIVE_OLLAMA_MODEL:-qwen2.5:3b}
      CRM_ERROR_RATE: ${CRM_ERROR_RATE:-0.05}
      LIVE_AGENTS: ${LIVE_AGENTS:-support,billing,accounts}
      LIVE_INTERVAL_SECONDS: ${LIVE_INTERVAL_SECONDS:-10}
      LIVE_DRIFT_EVERY: ${LIVE_DRIFT_EVERY:-20}
      LIVE_MAX_TICKETS: ${LIVE_MAX_TICKETS:-0}
      TRUSTVIAN_LIVE_AGENT: ${TRUSTVIAN_LIVE_AGENT:-support-fleet}
    volumes:
      # The control plane's database and dev's own state (the learned
      # baseline): kept by `down`, discarded by `down -v`.
      - live-state:/var/lib/trustvian-live
      - live-dev-state:/root/.trustvian
    # `down` sends SIGTERM; dev stops live.py, live.py its workers (SIGKILL
    # after 5 s), and dev completes the run before the control plane stops.
    stop_grace_period: 30s
    restart: unless-stopped

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    networks:
      demo:
        ipv4_address: 172.28.0.10
    restart: unless-stopped

networks:
  demo:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  ollama-models:
  live-state:
  live-dev-state:
