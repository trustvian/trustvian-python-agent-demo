# The stability measurement: an unchanged agent against itself.
#
# Trustvian task 078's "Measurement before implementation" section requires this
# number before the k-of-N machinery is built, and says the measurement is
# allowed to refute the amendment. It runs the *reference* side only — the same
# commit, the same toolset, the same prompt — N times, and compares those runs
# against each other.
#
# Temperature is the point. `make demo` runs at 0 because a story whose outcome
# changes between readings is not a story; this runs at 0.7, a common
# application-level default, because "how often does an unchanged agent fail a
# gate against itself" is not a question worth asking of a configuration nobody
# ships. The temperature is passed per repetition and recorded in the report.
version: "1"
name: stability
description: >-
  The reference workflow, unchanged, run N times against itself to measure how
  often a single-run gate reports a difference that is not there.

# Overridden by --runs. Ten is task 078's own "10 or more times".
runs: 10

command: [opentelemetry-instrument, python, agent/main.py]

services: [mocks]
requires: [ollama]

instrumentation: existing

# How many turns the model takes is its own decision, and at temperature 0.7 it
# varies by design — which is the thing being measured. A predicted count would
# turn the measurement's subject into a failure.
evidence: summary

# Both sides name the same candidate, and the sweep overrides it anyway: it
# allocates a fresh candidate namespace per invocation, and per repetition in the
# isolated configuration. dev's learned baseline is a file that persists across
# invocations, so a reused candidate id would start from whatever a previous
# sweep taught it.
reference:
  candidate: stability-reference
  env:
    SUPPORT_AGENT_MODE: reference
    SUPPORT_AGENT_ROUNDS: "3"

candidate:
  candidate: stability-reference
  env:
    SUPPORT_AGENT_MODE: reference
    SUPPORT_AGENT_ROUNDS: "3"

# The limits a developer would actually set, so the FAIL rate measured is the one
# they would experience. Zero added behaviors is the strictest there is.
gate:
  max_added_behaviors: 0
  max_block_decisions: 0
  max_critical_risk_observations: 0
